name: DingTalk Auto Sync

on:
  schedule:
    - cron: '0 1,9 * * *' # 每天北京时间 9:00 和 17:00
  workflow_dispatch:      # 支持手动触发

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run sync logic
        env:
          DING_APP_KEY: ${{ secrets.DING_APP_KEY }}
          DING_APP_SECRET: ${{ secrets.DING_APP_SECRET }}
          DING_OPERATOR_ID: ${{ secrets.DING_OPERATOR_ID }}
        run: python ai-reports/scripts/sync_logic.py

      - name: Force Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 强制标记 CSV 文件为已修改
          git add -f public/data/*.csv
          
          # 即使内容一模一样也强制生成提交
          git commit --allow-empty -m "auto: 物理覆盖最新业务数据 [skip ci]"
          
          # 强制推送到主分支
          git push origin main
