name: DingTalk Auto Sync

on:
  schedule:
    - cron: '0 1,9 * * *'
  workflow_dispatch: 

# 解决 Node 24 警告的关键环境变量
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run sync logic
        env:
          DING_APP_KEY: ${{ secrets.DING_APP_KEY }}
          DING_APP_SECRET: ${{ secrets.DING_APP_SECRET }}
          DING_OPERATOR_ID: ${{ secrets.DING_OPERATOR_ID }}
        run: python ai-reports/scripts/sync_logic.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/*.csv
          git add public/data/last_sync.txt
          # 强制创建一个提交，绕过 Git 的缓存判断
          git commit --allow-empty -m "auto: 解决Node版本警告并刷新真实数据 [skip ci]"
          git pull --rebase origin main
          git push origin main origin main
