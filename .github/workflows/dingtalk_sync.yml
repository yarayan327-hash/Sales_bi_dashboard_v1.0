name: DingTalk Auto Sync

on:
  schedule:
    - cron: '0 1,9 * * *' # 北京时间 9:00 和 17:00
  workflow_dispatch:      # 允许手动触发

# 关键：赋予 Action 写入仓库的权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 升级至 v4 以解决 Node.js 20 弃用警告
      - uses: actions/checkout@v4 
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: pip install requests pandas
        
      - name: Run sync logic
        env:
          DING_APP_KEY: ${{ secrets.DING_APP_KEY }}
          DING_APP_SECRET: ${{ secrets.DING_APP_SECRET }}
          DING_OPERATOR_ID: ${{ secrets.DING_OPERATOR_ID }}
        run: python ai-reports/scripts/sync_logic.py
        
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/*.csv
          # 检查是否有变化，没变化就不提交
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "auto: 自动同步业务数据 [skip ci]"
            git push
          fi
